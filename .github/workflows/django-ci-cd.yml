name: Vikmo CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: vikmo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-secret-key-for-ci-only
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DB_NAME: vikmo_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      # ── Step 1: Get the code ──────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 2: Set up Python ─────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Step 3: Install dependencies ──────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Step 4: Run migrations ────────────────────────────────────────
      - name: Run migrations
        run: python manage.py migrate

      # ── Step 5: Run tests (QUALITY GATE) ─────────────────────────────
      # If any test fails, pipeline stops here. Nothing gets deployed.
      - name: Run tests
        run: python manage.py test

      # ── Step 6: Build Docker image ────────────────────────────────────
      # Only runs if ALL 17 tests pass
      - name: Build Docker image
        run: docker build -t amansingh3413/vikmo-backend:latest .

      # ── Step 7: Log in to Docker Hub ──────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Step 8: Tag with build number (for rollback) ──────────────────
      - name: Tag image with build number
        run: |
          docker tag amansingh3413/vikmo-backend:latest amansingh3413/vikmo-backend:${{ github.run_number }}

      # ── Step 9: Push to Docker Hub ────────────────────────────────────
      - name: Push to Docker Hub
        run: |
          docker push amansingh3413/vikmo-backend:latest
          docker push amansingh3413/vikmo-backend:${{ github.run_number }}

      # ── Step 10: Trigger Render redeploy ──────────────────────────────
      # Only if everything above passed
      - name: Deploy to Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}