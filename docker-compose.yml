version: '3.9'

services:

  db:
    image: postgres:15
    container_name: vikmo_db
    restart: always
    environment:
      POSTGRES_DB: vikmo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass12345
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: vikmo_backend
    restart: always
    environment:
      DEBUG: "True"
      SECRET_KEY: "vikmo-docker-secret-key-change-in-production"
      DB_NAME: vikmo_db
      DB_USER: postgres
      DB_PASSWORD: pass12345
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: